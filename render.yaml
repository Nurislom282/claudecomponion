services:
  - type: web
    name: claude-companion-api
    runtime: node
    region: oregon
    plan: free
    rootDir: src/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
